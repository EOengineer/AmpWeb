# PostgreSQL. Versions 9.5 and up are supported.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: ampweb_development
  url: <%= ENV.fetch("DATABASE_URL", "postgres://ampweb:ampweb@localhost:5432/ampweb_development") %>

test:
  <<: *default
  database: ampweb_test
  url: <%= ENV.fetch("DATABASE_URL", "postgres://ampweb:ampweb@localhost:5432/ampweb_development").sub("ampweb_development", "ampweb_test") %>

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    database: ampweb_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: ampweb_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: ampweb_production_cable
    migrations_paths: db/cable_migrate
